name: Simple Maintenance Mode framework integration

on:
  push:
    branches:
      - feature/framework-integration-v2-20261110
  pull_request:

permissions:
  contents: read

jobs:
  plugin:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: zip, sodium
          coverage: none
      - name: Check runtime PHP syntax
        run: |
          find . -type f -name '*.php' -not -path './tools/*' -not -path './tests/*' -print0 | xargs -0 -n1 php -l
      - name: Check integration without WordPress
        run: php tests/framework-smoke.php
      - name: Validate manifest and package (PHP 8.1–8.5)
        run: |
          php tools/validate-manifest.php mti-plugin.json
          mkdir -p /tmp/smm-build/simple-maintenance-mode
          cp -a . /tmp/smm-build/simple-maintenance-mode/
          php tools/build-release.php /tmp/smm-build/simple-maintenance-mode /tmp/simple-maintenance-mode-qa.zip
          unzip -t /tmp/simple-maintenance-mode-qa.zip
          unzip -Z1 /tmp/simple-maintenance-mode-qa.zip | grep -Fx 'simple-maintenance-mode/css/admin-style.css'
          unzip -Z1 /tmp/simple-maintenance-mode-qa.zip | grep -Fx 'simple-maintenance-mode/js/admin.js'
          unzip -Z1 /tmp/simple-maintenance-mode-qa.zip | grep -Fx 'simple-maintenance-mode/maintenance-fullscreen-template.php'
          ! unzip -Z1 /tmp/simple-maintenance-mode-qa.zip | grep -E '(tests/|tools/|\.git/|\.github/)'

  wordpress:
    name: WordPress ${{ matrix.wordpress }} PHP ${{ matrix.php }} upgrade smoke
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.1'
            wordpress: '6.9'
          - php: '8.5'
            wordpress: '6.9'
          - php: '8.1'
            wordpress: '7.1.4'
          - php: '8.5'
            wordpress: '7.1.4'
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root-test-password
          MARIADB_DATABASE: wordpress
          MARIADB_USER: wpci
          MARIADB_PASSWORD: wpci-pass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mysqli, zip, sodium
          coverage: none
      - name: Install WP CLI and WordPress
        run: |
          curl -fsSL https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar -o /tmp/wp-cli.phar
          php /tmp/wp-cli.phar --info
          php /tmp/wp-cli.phar core download --path=/tmp/wp-ci --version=${{ matrix.wordpress }} --locale=en_US
          php /tmp/wp-cli.phar core config --path=/tmp/wp-ci --dbname=wordpress --dbuser=wpci --dbpass=wpci-pass --dbhost=127.0.0.1:3306 --skip-check
          php /tmp/wp-cli.phar core install --path=/tmp/wp-ci --url=http://localhost --title='SMM CI' --admin_user=admin --admin_password='ci-test-password' --admin_email=ci@example.test --skip-email
      - name: Install original v2 and capture saved options
        run: |
          mkdir -p /tmp/wp-ci/wp-content/plugins/simple-maintenance-mode
          git archive 7fc6757c7b5d813cc74cac92ff1491b9b013881e | tar -x -C /tmp/wp-ci/wp-content/plugins/simple-maintenance-mode
          php /tmp/wp-cli.phar plugin activate simple-maintenance-mode --path=/tmp/wp-ci
          php /tmp/wp-cli.phar option update simple_maintenance_mode_status maintenance --path=/tmp/wp-ci
          php /tmp/wp-cli.phar option update simple_maintenance_mode_page 42 --path=/tmp/wp-ci
          php /tmp/wp-cli.phar option update simple_maintenance_mode_bypass_token 'ci-token-keep-unchanged' --path=/tmp/wp-ci
          php /tmp/wp-cli.phar option update smm_layout split-left --path=/tmp/wp-ci
          php /tmp/wp-cli.phar option update smm_bypass_duration 24 --path=/tmp/wp-ci
      - name: Upgrade in place and verify legacy configuration
        run: |
          cp -a ./. /tmp/wp-ci/wp-content/plugins/simple-maintenance-mode/
          php /tmp/wp-cli.phar eval-file tests/wordpress-smoke.php --path=/tmp/wp-ci
          php /tmp/wp-cli.phar plugin list --path=/tmp/wp-ci --fields=name,status,version
      - name: Generate ephemeral signed ZIP release (never published)
        run: |
          mkdir -p /tmp/smm-fixture/simple-maintenance-mode
          cp -a ./. /tmp/smm-fixture/simple-maintenance-mode/
          php tests/prepare-signed-fixture.php
      - name: Exercise native WordPress signed update with API and ZIP failover
        run: |
          php /tmp/wp-cli.phar eval-file tests/signed-wordpress-upgrade.php --path=/tmp/wp-ci
          php /tmp/wp-cli.phar eval-file tests/wordpress-post-update.php --path=/tmp/wp-ci

